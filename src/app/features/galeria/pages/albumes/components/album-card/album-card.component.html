<button type="button" class="album-card" (click)="onClick()"
    [attr.aria-label]="'Abrir álbum ' + album().titulo + ', ' + album().totalFotos + ' fotos'">

    <span class="album-card__media">
        @if (portada(); as src) {
        <img class="album-card__img" [src]="src" [alt]="album().titulo" loading="lazy" />
        }
    </span>

    <span class="album-card__body">
        <span class="album-card__titulo">{{ album().titulo }}</span>

        <span class="album-card__meta">
            <span class="album-card__meta-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <circle cx="8.5" cy="10" r="1.4"></circle>
                    <path d="m4 17 4.5-4.5 3 3L15 12l5 5"></path>
                </svg>
            </span>
            <span class="album-card__meta-texto">{{ album().totalFotos }} fotos</span>
        </span>

        @if (album().subtitulo; as periodo) {
        <span class="album-card__periodo">{{ periodo }}</span>
        }
    </span>

</button>
