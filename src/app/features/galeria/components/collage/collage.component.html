<section class="collage" aria-labelledby="collage-title">
    <h2 id="collage-title" class="collage__sr-only">Galería histórica del ITD</h2>

    <!-- ============ BARRA DE CONTROLES ============ -->
    <div class="collage__toolbar">

        <app-galeria-tabs [tabs]="tabs" [activeTab]="activeTab()" (tabChange)="setTab($event)"></app-galeria-tabs>

        <app-barra-filtros [opciones]="filterOptions" [filtroActivo]="activeFilter()" [valorBusqueda]="searchTerm()"
            (busquedaChange)="onSearch($event)" (filtroChange)="selectFilter($event)"></app-barra-filtros>

    </div>

    <!-- ============ LÍNEA DEL TIEMPO ============ -->
    <div class="collage__timeline">
        @for (era of filteredEras(); track era.id) {
        <article class="collage__era">

            <span class="collage__era-dot" aria-hidden="true"></span>

            <div class="collage__era-info">
                <h3 class="collage__era-years">{{ era.years }}</h3>
                <p class="collage__era-title">{{ era.title }}</p>
                <p class="collage__era-desc">{{ era.description }}</p>
                <span class="collage__era-count">{{ era.photoCount }} fotos</span>
            </div>

            <div class="collage__era-photos">
                @for (photo of era.photos; track photo.id) {
                <button type="button" class="collage__photo" [style.background]="photo.gradient"
                    [attr.aria-label]="photo.label">
                </button>
                }

                <button type="button" class="collage__see-all" (click)="verTodas(era)">
                    <span class="collage__see-all-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <circle cx="8.5" cy="10" r="1.4"></circle>
                            <path d="m4 17 4.5-4.5 3 3L15 12l5 5"></path>
                        </svg>
                    </span>
                    <span class="collage__see-all-label">Ver todas</span>
                    <span class="collage__see-all-arrow" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="12" x2="19" y2="12"></line>
                            <polyline points="13.5 6.5 20 12 13.5 17.5"></polyline>
                        </svg>
                    </span>
                </button>
            </div>

        </article>
        } @empty {
        <p class="collage__empty">No encontramos fotos que coincidan con tu búsqueda.</p>
        }
    </div>

</section>
