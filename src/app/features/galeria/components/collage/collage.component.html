<section class="collage" aria-labelledby="collage-title">
    <h2 id="collage-title" class="collage__sr-only">Línea del tiempo del ITD</h2>

    <div class="collage__timeline">
        @for (epoca of epocasVisibles(); track epoca.id) {
        <article class="collage__era">

            <span class="collage__era-dot" aria-hidden="true"></span>

            <div class="collage__era-info">
                <h3 class="collage__era-years">{{ epoca.titulo }}</h3>
                <p class="collage__era-title">{{ epoca.subtitulo }}</p>
                <p class="collage__era-desc">{{ epoca.descripcion }}</p>
                <span class="collage__era-count">{{ epoca.totalFotos }} fotos</span>
            </div>

            <button type="button" class="collage__portada" [class.collage__portada--vacia]="!portada(epoca)"
                (click)="verTodas(epoca)" [attr.aria-label]="'Ver las fotografías de ' + epoca.titulo">

                @if (portada(epoca); as src) {
                <img class="collage__portada-img" [src]="src" [alt]="epoca.titulo" loading="lazy" />

                <span class="collage__portada-velo">
                    <span class="collage__portada-texto">
                        <span class="collage__see-all-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                <circle cx="8.5" cy="10" r="1.4"></circle>
                                <path d="m4 17 4.5-4.5 3 3L15 12l5 5"></path>
                            </svg>
                        </span>
                        Ver todas
                        <span class="collage__see-all-arrow" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                                stroke-linecap="round" stroke-linejoin="round">
                                <line x1="4" y1="12" x2="19" y2="12"></line>
                                <polyline points="13.5 6.5 20 12 13.5 17.5"></polyline>
                            </svg>
                        </span>
                    </span>
                </span>
                } @else {
                <span>Sin fotografías todavía</span>
                }
            </button>

        </article>
        } @empty {
        <p class="collage__empty">
            Todavía no hay épocas publicadas en la línea del tiempo.
        </p>
        }
    </div>

</section>
