<div class="galeria-tabs" role="tablist" [attr.aria-label]="ariaLabel()">
    @for (tab of tabs(); track tab.id) {
    <button type="button" role="tab" class="galeria-tabs__tab"
        [class.galeria-tabs__tab--active]="activeTab() === tab.id" [attr.aria-selected]="activeTab() === tab.id"
        (click)="seleccionar(tab.id)">

        <span class="galeria-tabs__icon" aria-hidden="true">
            @switch (tab.id) {
            @case ('timeline') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15.5 14"></polyline>
            </svg>
            }
            @case ('albums') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z">
                </path>
            </svg>
            }
            @case ('instalaciones') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M4 20V6.5L12 3l8 3.5V20"></path>
                <path d="M4 20h16"></path>
                <path d="M9 20v-4h6v4"></path>
                <path d="M8 11h1.5M14.5 11H16"></path>
            </svg>
            }
            @case ('estudiantes') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 4 2.5 8.5 12 13l9.5-4.5z"></path>
                <path d="M6.5 10.8v4.4c0 1.4 2.5 2.6 5.5 2.6s5.5-1.2 5.5-2.6v-4.4"></path>
            </svg>
            }
            }
        </span>

        <span class="galeria-tabs__label">{{ tab.label }}</span>
    </button>
    }
</div>
