<nav class="breadcrumb" aria-label="Ruta de navegación">
    <ol class="breadcrumb__lista">
        @for (item of items(); track item.label; let last = $last) {
        <li class="breadcrumb__item">
            @if (item.ruta && !last) {
            <a class="breadcrumb__link" [routerLink]="item.ruta">{{ item.label }}</a>
            } @else {
            <span class="breadcrumb__actual" aria-current="page">{{ item.label }}</span>
            }

            @if (!last) {
            <span class="breadcrumb__sep" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="9.5 6 15.5 12 9.5 18"></polyline>
                </svg>
            </span>
            }
        </li>
        }
    </ol>
</nav>
