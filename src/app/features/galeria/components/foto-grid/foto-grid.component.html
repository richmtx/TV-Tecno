<div class="foto-grid">
    @for (foto of fotos(); track foto.id; let i = $index) {
    <button type="button" class="foto-grid__item" [style.background]="foto.fallback"
        [attr.aria-label]="'Ampliar: ' + alt(foto, i)" (click)="onClick(i)">
        <img class="foto-grid__img" [src]="foto.src" [alt]="alt(foto, i)" loading="lazy" (error)="onImgError($event)" />
    </button>
    }
</div>
