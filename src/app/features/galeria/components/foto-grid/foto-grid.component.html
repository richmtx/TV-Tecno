<div class="foto-grid">
    @for (foto of fotos(); track foto.id; let i = $index) {
    <button type="button" class="foto-grid__item" [attr.aria-label]="'Ampliar: ' + alt(foto, i)" (click)="onClick(i)">
        <img class="foto-grid__img" [src]="url(foto)" [alt]="alt(foto, i)" loading="lazy" />
    </button>
    }
</div>
