<section class="egresados" aria-labelledby="egresados-title">
    <div class="egresados__inner">

        <div class="banner">

            <!-- Imagen -->
            <div class="banner__media" aria-hidden="true">
                <div class="banner__placeholder"></div>
            </div>

            <!-- Contenido -->
            <div class="banner__content">

                <div class="banner__copy">
                    <h2 id="egresados-title" class="banner__title">
                        ¿Eres egresado del ITD?
                    </h2>

                    <p class="banner__lead">
                        Tu experiencia sigue siendo parte de nuestra historia.
                    </p>

                    <p class="banner__text">
                        Contesta nuestro seguimiento de egresados
                        y mantente al contacto. Tu información nos ayuda
                        a seguir creciendo juntos.
                    </p>
                </div>

                <div class="banner__action">
                    <a class="banner__btn" [href]="enlaceSeguimiento">
                        <span>Ir al seguimiento de egresados</span>
                        <svg class="banner__btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14" />
                            <path d="m13 6 6 6-6 6" />
                        </svg>
                    </a>
                </div>

            </div>

        </div>

    </div>
</section>
