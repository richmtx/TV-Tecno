<section class="mosaico">
    <div class="mosaico__inner">

        @if (listo()) {

        @for (item of items(); track item.modificador; let i = $index) {
        <figure class="mosaico__item {{ item.modificador }}">
            @if (item.src) {
            <img [src]="item.src" [alt]="item.alt" class="mosaico__img" [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                [attr.fetchpriority]="i === 0 ? 'high' : null" decoding="async" />
            }
            @if (item.etiqueta) {
            <figcaption class="mosaico__etiqueta">{{ item.etiqueta }}</figcaption>
            }
        </figure>
        }

        } @else {

        @for (hueco of huecos; track hueco.clave) {
        <figure class="mosaico__item {{ hueco.modificador }} mosaico__item--esqueleto" aria-hidden="true"></figure>
        }

        }

    </div>
</section>
