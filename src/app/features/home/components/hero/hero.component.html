<section class="hero">

    <!-- Carrusel de fondo (decorativo) -->
    <div class="hero__slides" aria-hidden="true">
        @for (imagen of imagenes; track imagen; let i = $index) {
        <div class="hero__slide" [class.hero__slide--active]="i === indiceActual()"
            [style.background-image]="'url(' + imagen + ')'">
        </div>
        }
    </div>

    <!-- Filtro oscuro/guinda encima de las imágenes -->
    <div class="hero__overlay"></div>

    <div class="hero__container">
        <div class="hero__content">
            <h1 class="hero__title">
                El canal del
                <span class="hero__title-accent">Tecnológico</span>
            </h1>

            <p class="hero__subtitle">
                Noticias, eventos, cultura y ciencia desde el Instituto
                Tecnológico de Durango para toda la comunidad.
            </p>

            <div class="hero__actions">
                <a routerLink="/en-vivo" class="hero__btn hero__btn--primary">
                    <span class="hero__btn-dot" aria-hidden="true"></span>
                    Ver en vivo
                </a>
                <a routerLink="/programacion" class="hero__btn hero__btn--ghost">
                    Programación
                </a>
            </div>
        </div>
    </div>

</section>
