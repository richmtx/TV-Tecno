<nav class="dias-selector" aria-label="Selector de día">
    @for (dia of dias; track dia.index) {
    <button class="dias-selector__item" [class.dias-selector__item--activo]="dia.index === diaSeleccionado"
        [class.dias-selector__item--hoy]="esDiaActual(dia.index)" [attr.aria-pressed]="dia.index === diaSeleccionado"
        (click)="seleccionar(dia.index)" type="button">

        <span class="dias-selector__nombre">
            <span class="dias-selector__nombre--largo">{{ dia.nombre }}</span>
            <span class="dias-selector__nombre--corto" aria-hidden="true">{{ dia.corta }}</span>
        </span>
        <span class="dias-selector__fecha">{{ dia.fecha }}</span>
        <span class="dias-selector__contador">{{ dia.count }}<span class="dias-selector__contador-label">
                programas</span></span>
    </button>
    }
</nav>
