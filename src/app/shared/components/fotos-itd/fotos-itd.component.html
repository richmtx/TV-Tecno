<div class="fotos-itd">
    <div class="fotos-itd__left">
        <span class="fotos-itd__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <circle cx="8.5" cy="10" r="1.4"></circle>
                <path d="m4 17 4.5-4.5 3 3L15 12l5 5"></path>
            </svg>
        </span>

        <div class="fotos-itd__text">
            <h3 class="fotos-itd__title">{{ titulo }}</h3>
            <p class="fotos-itd__subtitle">{{ subtitulo }}</p>
        </div>
    </div>

    <a class="fotos-itd__btn" [routerLink]="ruta">
        <span class="fotos-itd__btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2.5" y="5" width="19" height="14" rx="2"></rect>
                <polyline points="3 6.5 12 13 21 6.5"></polyline>
            </svg>
        </span>
        <span>{{ textoBoton }}</span>
    </a>
</div>
