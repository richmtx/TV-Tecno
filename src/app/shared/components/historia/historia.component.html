<figure class="historia">
    <div class="historia__inner">
        <span class="historia__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M9.6 6.5c-3.1 1.3-5 3.9-5 7.1 0 2.4 1.5 4 3.6 4 1.9 0 3.3-1.4 3.3-3.2 0-1.8-1.3-3.1-3-3.1-.3 0-.6 0-.8.1.4-1.4 1.6-2.6 3.2-3.3zm8.6 0c-3.1 1.3-5 3.9-5 7.1 0 2.4 1.5 4 3.6 4 1.9 0 3.3-1.4 3.3-3.2 0-1.8-1.3-3.1-3-3.1-.3 0-.6 0-.8.1.4-1.4 1.6-2.6 3.2-3.3z">
                </path>
            </svg>
        </span>

        <blockquote class="historia__text">
            @for (linea of lineas; track $index) {
            <p>{{ linea }}</p>
            }
        </blockquote>

        <img class="historia__img" [src]="imagenSrc" [alt]="imagenAlt" [attr.aria-hidden]="imagenAlt ? null : true"
            width="420" height="380" />
    </div>
</figure>
